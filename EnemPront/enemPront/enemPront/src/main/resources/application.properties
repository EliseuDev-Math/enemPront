spring.application.name=enemPront
server.port=${PORT:8080}

# URL de conexão (ajuste host, porta e nome do banco)
spring.datasource.url=jdbc:postgresql://localhost:5432/meu_banco 

# Credenciais do PostgreSQL
spring.datasource.username=postgres
spring.datasource.password=sua_senha

# Comportamento do Hibernate em relação às tabelas
spring.jpa.hibernate.ddl-auto=validate

# Exibe o SQL gerado no console (útil durante o desenvolvimento)
spring.jpa.show-sql=true

spring.datasource.url=jdbc:h2:file:${ENEMPRONT_DB_PATH:./dados/enempront}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.multipart.enabled=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

enempront.timezone=${ENEMPRONT_TZ:America/Cuiaba}
enempront.admin.email=${ENEMPRONT_ADMIN_EMAIL:admin@enempront.local}
enempront.admin.nome=Administrador
enempront.admin.password=${ENEMPRONT_ADMIN_PASSWORD:}
